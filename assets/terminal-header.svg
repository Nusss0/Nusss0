<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .cursor {
      animation: blink 1.1s step-end infinite;
    }
    .pulse-green {
      animation: pulse 2.2s ease-in-out infinite;
    }
    .pulse-cyan {
      animation: pulse 2.8s ease-in-out infinite;
    }
    .fade-1 { opacity: 0; animation: fadeIn 0.5s ease forwards 0.2s; }
    .fade-2 { opacity: 0; animation: fadeIn 0.5s ease forwards 0.6s; }
    .fade-3 { opacity: 0; animation: fadeIn 0.5s ease forwards 1.0s; }
    .fade-4 { opacity: 0; animation: fadeIn 0.5s ease forwards 1.4s; }
    .bar-fill-1 { width: 0; animation: fill90 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.6s; }
    .bar-fill-2 { width: 0; animation: fill85 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.9s; }
    .bar-fill-3 { width: 0; animation: fill88 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards 1.2s; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fill90 { to { width: 175px; } }
    @keyframes fill85 { to { width: 162px; } }
    @keyframes fill88 { to { width: 168px; } }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="916" height="336" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Terminal Title Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 906 2 Q 918 2 918 14 L 918 36 L 2 36 Z" fill="#161f33" />
  <line x1="2" y1="36" x2="918" y2="36" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="22" cy="19" r="5.5" fill="#ef4444" />
  <circle cx="40" cy="19" r="5.5" fill="#f59e0b" />
  <circle cx="58" cy="19" r="5.5" fill="#10b981" />

  <!-- Tmux Title -->
  <text x="460" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono">
    nus@itb-cs: ~/workspace — tmux [0:profile*  1:offsec-telemetry  2:systems]
  </text>

  <!-- Live Status Indicator Top Right -->
  <circle cx="835" cy="19" r="4" fill="#34d399" class="pulse-green" />
  <text x="845" y="23" fill="#6ee7b7" font-size="11" class="mono">ACTIVE</text>

  <!-- Vertical Split Divider -->
  <line x1="485" y1="36" x2="485" y2="312" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- ================= LEFT PANE: WHOAMI & ARCHITECTURE ================= -->
  <g transform="translate(24, 60)">
    <!-- Prompt 1 -->
    <text x="0" y="0" font-size="13" class="mono">
      <tspan fill="#34d399" font-weight="bold">nus@itb</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#94a3b8">$ ./ inspect_profile --brief</tspan>
    </text>

    <g class="fade-1">
      <text x="0" y="28" fill="#f8fafc" font-size="19" font-weight="bold" class="sans">Stevanus Agustaf Wongso</text>
      <text x="242" y="28" fill="#22d3ee" font-size="13" class="mono">@Nusss0</text>
      <text x="0" y="48" fill="#94a3b8" font-size="12.5" class="mono">Computer Science @ Institut Teknologi Bandung (ITB)</text>
    </g>

    <!-- Prompt 2 -->
    <g class="fade-2">
      <text x="0" y="82" font-size="13" class="mono">
        <tspan fill="#34d399" font-weight="bold">nus@itb</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#94a3b8">$ cat /etc/engineering-domains.conf</tspan>
      </text>

      <!-- Domain 1 -->
      <rect x="0" y="95" width="435" height="44" rx="6" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="113" fill="#22d3ee" font-size="12" font-weight="bold" class="mono">[01] Offensive Security &amp; Binary Exploitation</text>
      <text x="12" y="130" fill="#94a3b8" font-size="11.5" class="mono">x86-64 Pwn · Shellcoding · Network/AD Enum · PCAP Forensics</text>

      <!-- Domain 2 -->
      <rect x="0" y="147" width="435" height="44" rx="6" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="165" fill="#818cf8" font-size="12" font-weight="bold" class="mono">[02] Systems, Compilers &amp; 3D Graphics</text>
      <text x="12" y="182" fill="#94a3b8" font-size="11.5" class="mono">C/C++17 · DFA/AST Compilers · Octree Voxelizer · SFML/raylib</text>

      <!-- Domain 3 -->
      <rect x="0" y="199" width="435" height="44" rx="6" fill="#131c2e" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="217" fill="#34d399" font-size="12" font-weight="bold" class="mono">[03] Applied Algorithms &amp; Full-Stack Tooling</text>
      <text x="12" y="234" fill="#94a3b8" font-size="11.5" class="mono">Go · TypeScript/React · Browser Extensions · Search Heuristics</text>
    </g>
  </g>

  <!-- ================= RIGHT PANE: LIVE TELEMETRY &GDB/VAULT SUMMARY ================= -->
  <g transform="translate(505, 60)">
    <text x="0" y="0" font-size="13" class="mono">
      <tspan fill="#f43f5e" font-weight="bold">pwndbg&gt;</tspan><tspan fill="#e2e8f0"> checksec --vault OffsecVault</tspan>
    </text>

    <!-- Memory / Security Telemetry Box -->
    <g class="fade-2">
      <rect x="0" y="14" width="390" height="86" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="34" font-size="11.5" class="mono">
        <tspan fill="#64748b">ARCH    :</tspan> <tspan fill="#e2e8f0">amd64-64-little / Linux ELF</tspan>
      </text>
      <text x="12" y="52" font-size="11.5" class="mono">
        <tspan fill="#64748b">WRITUPS :</tspan> <tspan fill="#34d399">30+ Solved</tspan> <tspan fill="#94a3b8">(pwn.college, OTW, HTB, Gemastik)</tspan>
      </text>
      <text x="12" y="70" font-size="11.5" class="mono">
        <tspan fill="#64748b">CPTS    :</tspan> <tspan fill="#38bdf8">Footprinting, Nmap IDS Evasion, PrivEsc</tspan>
      </text>
      <text x="12" y="88" font-size="11.5" class="mono">
        <tspan fill="#64748b">TOOLING :</tspan> <tspan fill="#fbbf24">GDB, strace/ltrace, tshark, Nmap, Burp</tspan>
      </text>
    </g>

    <!-- Repository & Activity Breakdown -->
    <g class="fade-3" transform="translate(0, 118)">
      <text x="0" y="0" fill="#94a3b8" font-size="12" class="mono">$ ./repo_metrics --breakdown</text>

      <!-- Metric 1 -->
      <text x="0" y="24" fill="#cbd5e1" font-size="11.5" class="mono">Systems &amp; C/C++</text>
      <rect x="135" y="14" width="190" height="10" rx="3" fill="#1e293b" />
      <rect x="135" y="14" width="175" height="10" rx="3" fill="url(#barCyan)" class="bar-fill-1" />
      <text x="335" y="23" fill="#22d3ee" font-size="11" class="mono">5 repos</text>

      <!-- Metric 2 -->
      <text x="0" y="48" fill="#cbd5e1" font-size="11.5" class="mono">OffSec &amp; WriteUps</text>
      <rect x="135" y="38" width="190" height="10" rx="3" fill="#1e293b" />
      <rect x="135" y="38" width="168" height="10" rx="3" fill="url(#barEmerald)" class="bar-fill-3" />
      <text x="335" y="47" fill="#34d399" font-size="11" class="mono">30+ WUs</text>

      <!-- Metric 3 -->
      <text x="0" y="72" fill="#cbd5e1" font-size="11.5" class="mono">Full-Stack &amp; AI/Alg</text>
      <rect x="135" y="62" width="190" height="10" rx="3" fill="#1e293b" />
      <rect x="135" y="62" width="162" height="10" rx="3" fill="url(#barIndigo)" class="bar-fill-2" />
      <text x="335" y="71" fill="#818cf8" font-size="11" class="mono">9 repos</text>
    </g>

    <!-- Active Prompt with Blinking Cursor -->
    <g class="fade-4" transform="translate(0, 222)">
      <text x="0" y="0" font-size="13" class="mono">
        <tspan fill="#f43f5e" font-weight="bold">pwndbg&gt;</tspan><tspan fill="#e2e8f0"> x/8gx $rsp </tspan>
      </text>
      <rect x="148" y="-11" width="8" height="14" fill="#22d3ee" class="cursor" />
    </g>
  </g>

  <!-- Bottom Tmux Status Bar -->
  <path d="M 2 312 L 918 312 L 918 326 Q 918 338 906 338 L 14 338 Q 2 338 2 326 Z" fill="#0f172a" />
  <line x1="2" y1="312" x2="918" y2="312" stroke="#1e293b" stroke-width="1" />
  <rect x="2" y="312" width="110" height="26" rx="0" fill="#06b6d4" />
  <text x="57" y="329" text-anchor="middle" fill="#0b0f19" font-weight="bold" font-size="11" class="mono">[0] nus@itb</text>
  <text x="128" y="329" fill="#64748b" font-size="11" class="mono">0:profile*   1:offsec-vault   2:arion-compiler   3:voxelizer</text>
  <text x="904" y="329" text-anchor="end" fill="#64748b" font-size="11" class="mono">x86_64-linux · UTF-8</text>
</svg>

